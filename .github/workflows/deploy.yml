name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  IMAGE: ghcr.io/sreelakshmi-gopakumar/flask-app

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest

      - name: Run pytest
        run: pytest app/tests/ -v

  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    # only build when pushing to main or dev, not on pull requests
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to container registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u sreelakshmi-gopakumar --password-stdin

      - name: Build image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            app/

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  security-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    steps:
      - name: Scan for critical CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:latest
          format: table
          exit-code: "1"
          severity: CRITICAL

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: security-scan
    # only deploy when merging/pushing to main, not dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connect to AKS cluster
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RG }}
          cluster-name: ${{ secrets.AZURE_AKS_NAME }}

      - name: Swap IMAGE_TAG placeholder for real commit SHA
        run: sed -i "s|latest|${{ github.sha }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/